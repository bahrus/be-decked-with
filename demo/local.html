<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local</title>
    <!-- #include virtual="/imports.html" -->

</head>
<body>
    <template id=myWrappingContent>
        <fieldset class=select-wrapper>
            <legend>{{dataset.label}}</legend>
            <label>
                <span>{{dataset.label}}</span>
                <slot></slot>
            </label>
        </fieldset>
        <style>
            .select-wrapper legend {
                display: none;
            }
        </style>
    </template>

    <select 
        data-label=Country
        be-decked-with=myWrappingContent>
        <option value="">Select a country</option>
        <option value="us">United States</option>
        <option value="uk">United Kingdom</option>
        <option value="ca">Canada</option>
        <option value="au">Australia</option>
        <option value="de">Germany</option>
        <option value="fr">France</option>
        <option value="jp">Japan</option>
    </select>

    <be-hive>
        <script type=emc src="be-decked-with/emc.mjs"></script>
    </be-hive>
    <script type=module>
        import 'be-hive/be-hive.js';
    </script>
</body>
</html>
