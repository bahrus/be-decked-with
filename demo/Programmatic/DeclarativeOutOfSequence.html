<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programmatic declarative out of sequence</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <template id=myWrappingContent>
        <fieldset class=select-wrapper>
            <legend>{{dataset.label}}</legend>
            <label>
                <span>{{dataset.label}}</span>
                <slot></slot>
            </label>
        </fieldset>
        <style>
            .select-wrapper legend {
                display: none;
            }
        </style>
    </template>

    <select id=country data-label=Country>
        <option value="">Select a country</option>
        <option value="us">United States</option>
        <option value="uk">United Kingdom</option>
        <option value="ca">Canada</option>
        <option value="au">Australia</option>
        <option value="de">Germany</option>
        <option value="fr">France</option>
        <option value="jp">Japan</option>
    </select>

    <script type=module>
        import {defBeDeckedWith} from 'be-decked-with/def.js';
        // Set before the config is registered -- .set creates a placeholder
        // and defers the real spawn until defBeDeckedWith registers it.
        country.enh.set.beDeckedWith.path = 'myWrappingContent';
        await defBeDeckedWith(document.body);
    </script>
</body>
</html>
