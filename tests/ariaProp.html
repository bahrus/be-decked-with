<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aria-prop</title>
    <!-- #include virtual="/imports.html" -->
    <script type=module>
        import '/emc.js';
    </script>
</head>
<body>
    <template id=myWrappingContent>
        <fieldset class=select-wrapper>
            <legend>{{ariaLabel}}</legend>
            <label>
                <span>{{ariaLabel}}</span>
                <slot></slot>
            </label>
        </fieldset>
        <style>
            .select-wrapper legend {
                display: none;
            }
        </style>
    </template>

    <select 
        aria-label=Country
        be-decked-with=myWrappingContent>
        <option value="">Select a country</option>
        <option value="us">United States</option>
        <option value="uk">United Kingdom</option>
        <option value="ca">Canada</option>
        <option value="au">Australia</option>
        <option value="de">Germany</option>
        <option value="fr">France</option>
        <option value="jp">Japan</option>
    </select>

    <div id='target'></div>

    <script>
        function runTest(){
            if(document.querySelector('legend')){
                target.setAttribute('mark', 'good');
            }
        }

        setTimeout(() => {
            runTest();
        }, 500)
    </script>
</body>
</html>
